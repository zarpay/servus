name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: gem

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: gem
          bundler-cache: true
      - run: bundle exec rubocop

  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: gem
          bundler-cache: true
      - run: bundle exec rspec

  demo:
    name: Demo app
    runs-on: ubuntu-latest
    # The demo path-pins ../gem, so this job is an integration test of the gem
    # in a real Rails app. If a gem change regresses documented behaviour, this
    # is what catches it.
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: demo
          bundler-cache: true
      - run: bin/rails db:migrate RAILS_ENV=test
      - run: bundle exec rspec
